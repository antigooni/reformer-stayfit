<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon-stayfit.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StayFit - Prenotazioni Reformer</title>
  <script>
    // Il manifesto e le icone si collegano solo nell'area admin, così le clienti non vedono "Installa app"
    if (location.pathname.startsWith('/admin')) {
      var m = document.createElement('link');
      m.rel = 'manifest';
      m.href = '/manifest-admin.webmanifest';
      document.head.appendChild(m);

      var a = document.createElement('link');
      a.rel = 'apple-touch-icon';
      a.href = '/icon-admin-180.png';
      document.head.appendChild(a);

      var t = document.createElement('meta');
      t.name = 'apple-mobile-web-app-title';
      t.content = 'Prenotazioni';
      document.head.appendChild(t);
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
